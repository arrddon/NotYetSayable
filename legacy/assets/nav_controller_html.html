<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Latent Homes Navigation</title>
<link href="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f2ec}
#map{position:absolute;inset:0}
.maplibregl-ctrl-attrib,.maplibregl-ctrl-logo{display:none!important}
</style>
</head>
<body>
<div id="map"></div>
<script>
let map=null,pendingView=null,ws=null,lastLiveSent=0,queuedLive=false,endTimer=null;
const liveInterval=80;
function connect(){
  ws=new WebSocket(`ws://${location.host}`);
  ws.onclose=()=>setTimeout(connect,1000);
}
function sendNav(type){
  if(!map||!ws||ws.readyState!==WebSocket.OPEN)return;
  const c=map.getCenter();
  ws.send(JSON.stringify({type,lng:c.lng,lat:c.lat,zoom:map.getZoom()}));
}
function sendLive(){
  const now=performance.now();
  if(now-lastLiveSent>=liveInterval){
    lastLiveSent=now;
    sendNav("nav_live");
    return;
  }
  if(queuedLive)return;
  queuedLive=true;
  setTimeout(()=>{
    queuedLive=false;
    lastLiveSent=performance.now();
    sendNav("nav_live");
  },liveInterval-(now-lastLiveSent));
}
function sendEnd(){
  clearTimeout(endTimer);
  endTimer=setTimeout(()=>sendNav("nav_end"),40);
}
function hideLabels(){
  for(const layer of map.getStyle().layers||[]){
    if(layer.type==="symbol")map.removeLayer(layer.id);
  }
}
function initMap(){
  map=new maplibregl.Map({
    container:"map",
    style:"https://tiles.openfreemap.org/styles/dark",
    center:[0,20],
    zoom:2,
    minZoom:0,
    maxZoom:16.4,
    bearing:0,
    pitch:0
  });
  map.dragRotate.disable();
  map.touchZoomRotate.disableRotation();
  map.setMaxPitch(0);
  map.on("move",sendLive);
  map.on("zoom",sendLive);
  map.on("moveend",sendEnd);
  map.on("zoomend",sendEnd);
  map.on("load",()=>{
    hideLabels();
    if(pendingView){
      td_setView(pendingView.lng,pendingView.lat,pendingView.zoom);
      pendingView=null;
    }
  });
}
function td_setView(lng,lat,zoom){
  if(!map){
    pendingView={lng,lat,zoom};
    return;
  }
  map.jumpTo({center:[lng,lat],zoom,bearing:0,pitch:0});
}
window.td_setView=td_setView;
connect();
initMap();
</script>
</body>
</html>
