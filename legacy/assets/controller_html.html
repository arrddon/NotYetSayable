<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Not Yet Sayable Controller</title>
<link href="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.js"></script>
<style>
:root{--blue:#0e3aff;--white:#f8fbff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--blue);color:var(--blue);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#app,#map,#recording{position:absolute;inset:0}
#map{opacity:0;pointer-events:none;transition:opacity .35s ease}
body.map-mode #map{opacity:1;pointer-events:auto}
#idle{position:absolute;left:50%;top:50%;width:min(64vw,320px);height:min(64vw,320px);border-radius:50%;border:1px solid rgba(248,251,255,.45);transform:translate(-50%,-50%) scale(.84);opacity:0;pointer-events:none;box-shadow:0 0 34px rgba(248,251,255,.18),inset 0 0 30px rgba(248,251,255,.1);animation:idleBreath 1.7s ease-in-out infinite;z-index:8}
body.idle-mode #idle{opacity:1}
body.map-mode #idle{display:none}
#confirm{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.96);width:min(78vw,390px);height:min(78vw,390px);border:1px solid rgba(248,251,255,.96);border-radius:50%;background:rgba(248,251,255,.13);color:var(--white);font:inherit;font-size:clamp(24px,6.5vw,38px);font-weight:760;letter-spacing:.18em;text-transform:uppercase;box-shadow:0 0 40px rgba(248,251,255,.46),0 0 120px rgba(248,251,255,.2),inset 0 0 34px rgba(248,251,255,.14);opacity:0;pointer-events:none;transition:opacity .32s ease,transform .32s ease,filter .16s ease;z-index:20}
#confirm.ready{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1);animation:buttonBreath 1.8s ease-in-out infinite}
body.map-mode #confirm{top:auto;bottom:max(26px,env(safe-area-inset-bottom));width:min(320px,calc(100% - 48px));height:68px;border-radius:999px;font-size:18px;transform:translateX(-50%) translateY(12px)}
body.map-mode #confirm{background:var(--blue);color:var(--white);box-shadow:0 0 34px rgba(14,58,255,.72),0 0 92px rgba(14,58,255,.34),inset 0 0 22px rgba(255,255,255,.13)}
body.map-mode #confirm.ready{transform:translateX(-50%) translateY(0)}
#confirm:active{filter:brightness(1.35)}
#pin{position:absolute;left:50%;top:50%;width:30px;height:30px;transform:translate(-50%,-100%);opacity:0;pointer-events:none;z-index:12}
body.map-mode #pin{opacity:1}
#pin:before{content:"";position:absolute;left:50%;top:0;width:20px;height:20px;transform:translateX(-50%) rotate(45deg);border:1px solid rgba(120,175,255,.95);border-radius:50% 50% 50% 0;background:rgba(31,107,255,.26);box-shadow:0 0 26px rgba(31,107,255,.9)}
#pin:after{content:"";position:absolute;left:50%;top:7px;width:6px;height:6px;transform:translateX(-50%);border-radius:50%;background:var(--white)}
#recording{display:none;place-items:center;pointer-events:none}
body.recording-mode #recording{display:grid}
.rec-core{width:92px;height:92px;border-radius:50%;background:var(--white);box-shadow:0 0 30px rgba(248,251,255,.95),0 0 90px rgba(248,251,255,.55);animation:pulse 1.05s ease-in-out infinite}
.rec-ring{position:absolute;width:142px;height:142px;border:1px solid rgba(248,251,255,.8);border-radius:50%;animation:ring 1.05s ease-out infinite}
@keyframes pulse{0%,100%{opacity:.45;transform:scale(.72)}50%{opacity:1;transform:scale(1)}}
@keyframes ring{0%{opacity:.9;transform:scale(.55)}100%{opacity:0;transform:scale(1.45)}}
@keyframes idleBreath{0%,100%{opacity:.22;transform:translate(-50%,-50%) scale(.82)}50%{opacity:.72;transform:translate(-50%,-50%) scale(1)}}
@keyframes buttonBreath{0%,100%{box-shadow:0 0 36px rgba(248,251,255,.42),0 0 96px rgba(248,251,255,.18),inset 0 0 22px rgba(14,58,255,.06)}50%{box-shadow:0 0 58px rgba(248,251,255,.75),0 0 150px rgba(248,251,255,.32),inset 0 0 34px rgba(14,58,255,.1)}}
.maplibregl-ctrl-attrib,.maplibregl-ctrl-logo{display:none!important}
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <div id="pin"></div>
  <div id="idle"></div>
  <div id="recording"><div class="rec-ring"></div><div class="rec-core"></div></div>
  <button id="confirm">Confirm</button>
</div>
<script>
let ws,map,currentPhase=null,readyTimer=null,lastMapLiveSent=0,queuedMapLive=false,mapEndTimer=null;
const btn=document.getElementById("confirm");
const zoomOffset=1.5;
const confirmPhases=new Set([0,1,2,3,6,9]);
const recordingPhases=new Set([4,7,10,13]);
const mapPhase=12;
const mapLiveInterval=120;
const delay={0:800,1:1500,2:1500,3:5000,6:5000,9:5000,12:5000};
const labels={0:"Begin",1:"Consent",12:"Place Pin"};
function connect(){ws=new WebSocket(`ws://${location.host}`);ws.onclose=()=>setTimeout(connect,1000);ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==="phase_state")setPhase(Number(m.phase))}catch(_){}}}
function send(m){if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify(m))}
function sendMapLive(){if(currentPhase!==mapPhase)return;const now=performance.now();if(now-lastMapLiveSent>=mapLiveInterval){lastMapLiveSent=now;sendMap("map_live");return}if(queuedMapLive)return;queuedMapLive=true;setTimeout(()=>{queuedMapLive=false;lastMapLiveSent=performance.now();sendMap("map_live")},mapLiveInterval-(now-lastMapLiveSent))}
function sendMapEnd(){if(currentPhase!==mapPhase)return;clearTimeout(mapEndTimer);mapEndTimer=setTimeout(()=>sendMap("map_end"),40)}
function hideLabels(){for(const layer of map.getStyle().layers||[]){if(layer.type==="symbol")map.removeLayer(layer.id)}}
function initMap(){map=new maplibregl.Map({container:"map",style:"https://tiles.openfreemap.org/styles/dark",center:[0,20],zoom:2,minZoom:0,maxZoom:16.4,bearing:0,pitch:0});map.dragRotate.disable();map.touchZoomRotate.disableRotation();map.setMaxPitch(0);map.on("load",hideLabels);map.on("move",sendMapLive);map.on("zoom",sendMapLive);map.on("moveend",sendMapEnd);map.on("zoomend",sendMapEnd)}
function sendMap(type){if(!map)return;const c=map.getCenter();send({type,phase:currentPhase,lng:c.lng,lat:c.lat,zoom:map.getZoom()+zoomOffset})}
function setPhase(p){if(!Number.isFinite(p)||p===currentPhase)return;currentPhase=p;clearTimeout(readyTimer);btn.textContent=labels[p]||"Confirm";btn.classList.remove("ready");btn.disabled=true;const isMap=p===mapPhase;const isRecording=recordingPhases.has(p);const waitsForButton=confirmPhases.has(p)||isMap;document.body.classList.toggle("map-mode",isMap);document.body.classList.toggle("recording-mode",isRecording);document.body.classList.toggle("idle-mode",waitsForButton&&!isRecording);if(waitsForButton){readyTimer=setTimeout(()=>{document.body.classList.remove("idle-mode");btn.disabled=false;btn.classList.add("ready");if(isMap)map.resize()},delay[p]||5000)}}
function confirmNow(){if(btn.disabled)return;btn.disabled=true;btn.classList.remove("ready");if(currentPhase===mapPhase&&map){const c=map.getCenter();send({type:"map_confirm",phase:currentPhase,lng:c.lng,lat:c.lat,zoom:map.getZoom()+zoomOffset})}else send({type:"confirm",phase:currentPhase})}
async function poll(){try{const r=await fetch("/state",{cache:"no-store"});if(r.ok){const d=await r.json();setPhase(Number(d.phase))}}catch(_){}}
function td_setPhase(p){setPhase(Number(p))}
function td_setView(lng,lat,zoom){if(map)map.jumpTo({center:[lng,lat],zoom,bearing:0,pitch:0})}
window.td_setPhase=td_setPhase;window.td_setView=td_setView;btn.onclick=confirmNow;btn.addEventListener("touchend",e=>{e.preventDefault();confirmNow()},{passive:false});
connect();initMap();poll();setInterval(poll,300);
</script>
</body>
</html>
